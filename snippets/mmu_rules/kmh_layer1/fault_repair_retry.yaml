id: fault_repair_retry
requestor: load
mode: host_single_stage
setup:
  mappings:
    - name: retry_fault_page
      va: 0xb00004000
      pa: 0x81039000
      perms: [r, a, d]
      fault: true
actions:
  handler:
    - repair_fault_mapping
trigger:
  op: load
  addr: retry_fault_page
expect:
  result: page_fault
  retry: repair_then_reexecute
observe:
  - fault_cause_match
  - memory_value_match
coverage_tags:
  - requestor.load
  - mode.host_single_stage
  - exception.page_fault
  - retry.repair_then_reexecute
