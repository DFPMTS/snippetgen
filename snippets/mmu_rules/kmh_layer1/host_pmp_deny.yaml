id: host_pmp_deny
requestor: load
mode: host_single_stage
setup:
  pmp:
    deny_napot:
      register: 1
      size: 65536
      permissions: []
  mappings:
    - name: pmp_deny_page
      va: 0x900050000
      pa: 0x81035000
      perms: [r, a, d]
trigger:
  op: load
  addr: pmp_deny_page
expect:
  result: access_fault
observe:
  - fault_cause_match
  - attribute_policy_match
coverage_tags:
  - requestor.load
  - mode.host_single_stage
  - exception.access_fault
  - attr.pmp_deny
