id: host_sum_user_load_fault
requestor: load
mode: host_single_stage
setup:
  mappings:
    - name: sum_off_user_page
      va: 0x9000b0000
      pa: 0x8103b000
      perms: [r, u, a, d]
trigger:
  op: load
  addr: sum_off_user_page
expect:
  result: page_fault
observe:
  - fault_cause_match
coverage_tags:
  - requestor.load
  - mode.host_single_stage
  - exception.page_fault
  - pte.u
  - priv.sum
