id: load_accessed_bit_fault
requestor: load
mode: host_single_stage
setup:
  mappings:
    - name: accessed_clear_page
      va: 0x9000c0000
      pa: 0x8103c000
      perms: [r]
trigger:
  op: load
  addr: accessed_clear_page
expect:
  result: page_fault
observe:
  - fault_cause_match
coverage_tags:
  - requestor.load
  - mode.host_single_stage
  - exception.page_fault
  - pte.r
  - pte.a
