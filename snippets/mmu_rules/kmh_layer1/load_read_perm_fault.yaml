id: load_read_perm_fault
requestor: load
mode: host_single_stage
setup:
  mappings:
    - name: read_perm_fault_page
      va: 0xb00008000
      pa: 0x8102a000
      perms: [r, a]
      fault: true
actions:
  handler:
    - repair_fault_mapping
  post_check:
    - record_fault_snapshot
trigger:
  op: load
  addr: read_perm_fault_page
expect:
  result: page_fault
observe:
  - fault_cause_match
coverage_tags:
  - requestor.load
  - mode.host_single_stage
  - exception.page_fault
  - pte.r
  - pte.a
