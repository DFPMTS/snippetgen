id: only_stage2_hsv_guest_fault
requestor: hsv
mode: onlyStage2
setup:
  mappings:
    - name: stage2_hsv_fault_page
      stage: stage2
      va: 0x80414000
      pa: 0x80415000
      perms: [r, w, a, d]
      fault: true
trigger:
  op: guest_store
  addr: stage2_hsv_fault_page
expect:
  result: guest_page_fault
observe:
  - fault_cause_match
coverage_tags:
  - requestor.hsv
  - mode.onlyStage2
  - guest.vs_only
  - exception.guest_page_fault
  - pte.w
  - pte.d
