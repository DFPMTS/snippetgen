id: store_dirty_bit_fault
requestor: store
mode: host_single_stage
setup:
  mappings:
    - name: dirty_clear_page
      va: 0x9000d0000
      pa: 0x8103d000
      perms: [r, w, a]
trigger:
  op: store
  addr: dirty_clear_page
expect:
  result: page_fault
observe:
  - fault_cause_match
coverage_tags:
  - requestor.store
  - mode.host_single_stage
  - exception.page_fault
  - pte.w
  - pte.a
  - pte.d
