id: store_page_fault
requestor: store
mode: host_single_stage
setup:
  mappings:
    - name: store_fault_page
      va: 0xb00001000
      pa: 0x81023000
      perms: [r, w, a, d]
      fault: true
actions:
  handler:
    - repair_fault_mapping
  post_check:
    - record_fault_snapshot
trigger:
  op: store
  addr: store_fault_page
expect:
  result: page_fault
observe:
  - fault_cause_match
coverage_tags:
  - requestor.store
  - mode.host_single_stage
  - exception.page_fault
